<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>
  // "js" habilita los estados iniciales de animación; "intro" muestra la pantalla de carga
  // en cada carga o recarga (F5). Al navegar entre páginas se usa la cortina en su lugar.
  (function (d) {
    d.classList.add("js");
    try {
      if (sessionStorage.getItem("syntax-curtain")) d.classList.add("from-curtain");
      else if (!matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("intro");
    } catch (e) {}
  })(document.documentElement);
</script>
